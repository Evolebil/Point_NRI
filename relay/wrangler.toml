name = "dnd-arena"
main = "worker.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# бесплатный тариф: Durable Object на SQLite
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# библиотеки 3D и модели бойцов — с Cloudflare, без туннеля (копии web/vendor, web/assets/models; собирает deploy.sh);
# пути, которых нет в public, идут в worker.js как раньше
[assets]
directory = "./public"
