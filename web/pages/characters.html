<section class="scene" id="s8" data-route="characters">
  <div class="page">
    <h1 class="page-title">Мои персонажи</h1>
    <div class="cols cols-side">
      <div class="panel">
        <h2>Сохранённые персонажи</h2>
        <div class="list" id="charList"></div>
      </div>
      <aside class="panel panel-actions">
        <button class="btn btn-accent btn-lg" id="charCreate" type="button">Создать персонажа</button>
        <button class="btn btn-lg" id="charUpload" type="button">Загрузить из файла</button>
        <button class="btn btn-lg" id="charTemplate" type="button">Выбрать готового</button>
        <p class="muted small">Персонаж собирается за очки: характеристики, оружие, способности, защита, скорость и черты.</p>
        <input type="file" id="charFile" accept="application/json,.json" hidden>
      </aside>
    </div>
  </div>
</section>
